<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout RWD - Bài tập</title>
  <style>
    /* ================= RESET ================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #eef1f5;
      padding: 10px;
      min-height: 100vh;
    }

    .wrapper {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ================= CÁC KHỐI ================= */
    .header, .nav, .content, .sidebar, .footer {
      border-radius: 8px;
      padding: 24px 16px;
      text-align: center;
      font-weight: bold;
      color: #fff;
      font-size: 18px;
      letter-spacing: 1px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .header  { background: linear-gradient(135deg, #2c3e50, #4a6572); }
    .nav     { background: #34495e; margin-top: 10px; padding: 14px 16px; }
    .content { background: linear-gradient(135deg, #3498db, #5dade2); min-height: 300px;
               display: flex; align-items: center; justify-content: center; }
    .sidebar { background: linear-gradient(135deg, #e67e22, #f39c12); min-height: 300px;
               display: flex; align-items: center; justify-content: center; }
    .footer  { background: linear-gradient(135deg, #2c3e50, #4a6572); margin-top: 10px; }

    /* ================= MENU ================= */
    .nav ul {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 28px;
    }

    .nav a {
      color: #fff;
      text-decoration: none;
      padding: 6px 10px;
      border-radius: 4px;
      transition: background 0.3s;
    }

    .nav a:hover {
      background: rgba(255,255,255,0.2);
    }

    /* ================= MAIN ================= */
    /* Mobile-first: xếp dọc */
    .main {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    /* ================= TABLET ≥ 768px ================= */
    @media (min-width: 768px) {
      .main {
        flex-direction: row;
      }
      .content { flex: 3; }
      .sidebar { flex: 1; }

      .header, .footer { padding: 32px 16px; }
    }

    /* ================= DESKTOP ≥ 1200px ================= */
    @media (min-width: 1200px) {
      .content { min-height: 420px; }
      .sidebar { min-height: 420px; }
    }

    /* ================= MOBILE NHỎ < 480px ================= */
    @media (max-width: 480px) {
      .nav ul {
        flex-direction: column;
        gap: 8px;
      }
      .header, .footer { font-size: 16px; padding: 18px 12px; }
    }
  </style>
</head>
<body>

  <div class="wrapper">

    <header class="header">HEADER</header>

    <nav class="nav">
      <ul>
        <li><a href="#">Trang chủ</a></li>
        <li><a href="#">Giới thiệu</a></li>
        <li><a href="#">Sản phẩm</a></li>
        <li><a href="#">Liên hệ</a></li>
      </ul>
    </nav>

    <div class="main">
      <section class="content">CONTENT</section>
      <aside class="sidebar">SIDEBAR</aside>
    </div>

    <footer class="footer">FOOTER</footer>

  </div>

</body>
</html>
